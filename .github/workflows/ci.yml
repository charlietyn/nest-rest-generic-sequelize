name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node }} / Nest ${{ matrix.nest }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
        nest: ['11', '12']
        os: [ubuntu-latest]
        include:
          - node: '24'
            nest: '12'
            os: windows-latest
    env:
      NEST_VERSION: ${{ matrix.nest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Select NestJS 11 compatibility dependencies
        if: matrix.nest == '11'
        run: npm install --no-save --package-lock=false @nestjs/common@11 @nestjs/core@11 @nestjs/testing@11 @nestjs/platform-express@11 @nestjs/sequelize@11
      - run: npm run validate

  minimum-runtime:
    name: Minimum Node 22 runtime / Nest ${{ matrix.nest }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        nest: ['11', '12']
    env:
      NEST_VERSION: ${{ matrix.nest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check:package
      # Native Node imports and types, without Jest's newer VM requirements.
      - run: npm run test:package
