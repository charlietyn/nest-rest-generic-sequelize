name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node }} / Nest ${{ matrix.nest }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
        nest: ['11', '12']
        os: [ubuntu-latest]
        include:
          - node: '24'
            nest: '12'
            os: windows-latest
    env:
      NEST_VERSION: ${{ matrix.nest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Select NestJS 11 compatibility dependencies
        if: matrix.nest == '11'
        run: npm install --no-save --package-lock=false @nestjs/common@11 @nestjs/core@11 @nestjs/testing@11 @nestjs/platform-express@11 @nestjs/sequelize@11
      - run: npm run validate
      - run: npm run test:cov
      - name: Preserve dependency audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-node${{ matrix.node }}-nest${{ matrix.nest }}-${{ matrix.os }}
          path: .artifacts/audit/*.json
          retention-days: 14

  minimum-runtime:
    name: Minimum Node 22 runtime / Nest ${{ matrix.nest }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        nest: ['11', '12']
    env:
      NEST_VERSION: ${{ matrix.nest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check:package
      # Native Node imports and types, without Jest's newer VM requirements.
      - run: npm run test:package
      - name: Preserve consumer audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-node22-minimum-nest${{ matrix.nest }}
          path: .artifacts/audit/*.json
          retention-days: 14
